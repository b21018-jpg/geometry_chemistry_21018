<!DOCTYPE html>
<html lang="ko" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 분자 모형 및 공간좌표 시뮬레이터</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Three.js OrbitControls -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        /* Custom scrollbar styling for sidebar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.6);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(51, 65, 85, 0.8);
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(71, 85, 105, 1);
        }
    </style>
</head>
<body class="h-full m-0 p-0 overflow-hidden bg-slate-950 text-slate-100 flex flex-col md:flex-row select-none">

    <!-- 좌측 설정을 위한 패널 -->
    <aside class="w-full md:w-96 flex-shrink-0 flex flex-col bg-slate-900/95 border-r border-slate-800 z-10 overflow-y-auto h-auto md:h-full max-h-[50vh] md:max-h-full">
        <!-- 헤더 영역 -->
        <div class="p-5 border-b border-slate-800 bg-slate-900/50">
            <div class="flex items-center gap-3">
                <div class="p-2.5 bg-blue-600/20 text-blue-400 rounded-xl border border-blue-500/30">
                    <i class="fa-solid fa-atom text-xl"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg text-slate-100 leading-tight">3D 분자 모형 시뮬레이터</h1>
                    <p class="text-xs text-slate-400 mt-0.5">기하 발표용 공간좌표 시각화 도구</p>
                </div>
            </div>
        </div>

        <!-- 설정 섹션 -->
        <div class="p-5 space-y-6 flex-1">
            
            <!-- 분자선택 및 입력칸 -->
            <div class="space-y-2">
                <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider">
                    <i class="fa-solid fa-flask mr-1 text-blue-400"></i> 분자선택 / 분자식 입력
                </label>
                <div class="grid grid-cols-1 gap-2">
                    <select id="moleculePreset" onchange="handlePresetChange()" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-blue-500 transition">
                        <option value="NH3" selected>암모니아 (NH₃)</option>
                        <option value="CH4">메테인 (CH₄)</option>
                        <option value="H2O">물 (H₂O)</option>
                        <option value="CO2">이산화탄소 (CO₂)</option>
                        <option value="BF3">삼불화붕소 (BF₃)</option>
                        <option value="CUSTOM">직접 입력 (사용자 지정)</option>
                    </select>
                </div>
                
                <!-- 사용자 지정 분자식 이름 입력 (CUSTOM 전용) -->
                <div id="customFormulaContainer" class="hidden mt-2">
                    <input type="text" id="customFormulaInput" placeholder="예: AX3" value="AX3" oninput="updateCustomMoleculeName()" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-blue-500">
                </div>
            </div>

            <!-- 원자와 원자 사이의 거리 설정 슬라이더 -->
            <div class="space-y-2 bg-slate-800/40 p-3.5 rounded-xl border border-slate-800">
                <div class="flex justify-between items-center text-xs">
                    <span class="font-semibold text-slate-300">
                        <i class="fa-solid fa-ruler-horizontal mr-1 text-indigo-400"></i> 원자 간 거리 비율
                    </span>
                    <span id="distanceValue" class="font-mono text-blue-400 font-bold bg-blue-500/10 px-2 py-0.5 rounded">1.000</span>
                </div>
                <input type="range" id="distanceSlider" min="0.5" max="2.5" step="0.05" value="1.0" oninput="handleDistanceChange()" class="w-full accent-blue-500 h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer">
                <p class="text-[11px] text-slate-500">중심원자로부터의 위치벡터 크기 스케일을 조절합니다.</p>
            </div>

            <!-- 원자 좌표 테이블 (소수점 셋째자리) -->
            <div class="space-y-2">
                <div class="flex justify-between items-center">
                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider">
                        <i class="fa-solid fa-location-dot mr-1 text-emerald-400"></i> 공간좌표 목록 (O = 0,0,0)
                    </label>
                    <span class="text-[10px] bg-slate-800 text-slate-400 px-2 py-0.5 rounded-full border border-slate-700">원점: 중심원자</span>
                </div>

                <div class="border border-slate-800 rounded-xl overflow-hidden bg-slate-900/80">
                    <table class="w-full text-left text-xs">
                        <thead class="bg-slate-800/80 text-slate-400 border-b border-slate-700/60 font-semibold">
                            <tr>
                                <th class="py-2.5 px-3">원자</th>
                                <th class="py-2.5 px-2 text-center text-red-400">X</th>
                                <th class="py-2.5 px-2 text-center text-emerald-400">Y</th>
                                <th class="py-2.5 px-2 text-center text-blue-400">Z</th>
                            </tr>
                        </thead>
                        <tbody id="atomTableBody" class="divide-y divide-slate-800/60 font-mono text-slate-300">
                            <!-- JS로 동적 할당됨 -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- 직접 입력 시 원자 추가 버튼 (CUSTOM 상태일 때 표시) -->
            <div id="customAtomControls" class="hidden space-y-3 pt-2 border-t border-slate-800">
                <div class="text-xs font-semibold text-slate-300">주변 원자 추가</div>
                <div class="grid grid-cols-4 gap-1.5">
                    <input type="text" id="newAtomName" placeholder="원자명" value="H" class="bg-slate-800 border border-slate-700 rounded px-2 py-1 text-xs text-center">
                    <input type="number" id="newAtomX" step="0.1" placeholder="X" value="1.000" class="bg-slate-800 border border-slate-700 rounded px-2 py-1 text-xs text-center">
                    <input type="number" id="newAtomY" step="0.1" placeholder="Y" value="0.000" class="bg-slate-800 border border-slate-700 rounded px-2 py-1 text-xs text-center">
                    <input type="number" id="newAtomZ" step="0.1" placeholder="Z" value="0.000" class="bg-slate-800 border border-slate-700 rounded px-2 py-1 text-xs text-center">
                </div>
                <button onclick="addCustomAtom()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-medium py-1.5 rounded-lg text-xs transition">
                    + 주변 원자 추가하기
                </button>
            </div>

            <!-- 범례 (공간좌표 축 안내) -->
            <div class="pt-2">
                <div class="bg-slate-950/60 p-3 rounded-xl border border-slate-800/80 text-xs space-y-1.5 text-slate-400">
                    <div class="font-semibold text-slate-300 mb-1">공간좌표계 범례</div>
                    <div class="flex items-center gap-2">
                        <span class="w-3 h-3 rounded-full bg-red-500 inline-block"></span>
                        <span><b>X축</b> (빨간색)</span>
                    </div>
                    <div class="flex items-center gap-2">
                        <span class="w-3 h-3 rounded-full bg-emerald-500 inline-block"></span>
                        <span><b>Y축</b> (초록색)</span>
                    </div>
                    <div class="flex items-center gap-2">
                        <span class="w-3 h-3 rounded-full bg-blue-500 inline-block"></span>
                        <span><b>Z축</b> (파란색)</span>
                    </div>
                </div>
            </div>

        </div>

        <!-- 하단 푸터 / 조작 방법 -->
        <div class="p-4 border-t border-slate-800 bg-slate-950/40 text-[11px] text-slate-500 flex justify-between items-center">
            <span><i class="fa-solid fa-hand-pointer mr-1"></i> 마우스 회전 / 확대 / 이동 가능</span>
            <button onclick="resetCamera()" class="text-blue-400 hover:text-blue-300 font-semibold flex items-center gap-1">
                <i class="fa-solid fa-arrows-rotate"></i> 시점 초기화
            </button>
        </div>
    </aside>

    <!-- 메인 3D 공간좌표 메인 화면 -->
    <main class="flex-1 relative w-full h-full min-h-[50vh] bg-slate-950 overflow-hidden">
        <!-- 3D Canvas 가 들어올 영역 -->
        <div id="canvas-container" class="w-full h-full absolute inset-0"></div>

        <!-- 좌측 상단 분자식 배지 -->
        <div class="absolute top-4 left-4 z-10 pointer-events-none">
            <div class="bg-slate-900/80 backdrop-blur-md border border-slate-800 px-4 py-2 rounded-xl shadow-2xl">
                <span class="text-xs text-slate-400 block font-medium">현재 분자</span>
                <span id="badgeMoleculeName" class="text-xl font-extrabold text-blue-400 font-mono">암모니아 (NH₃)</span>
            </div>
        </div>

        <!-- 우측 상단 그리드/축 토글 버튼 -->
        <div class="absolute top-4 right-4 z-10 flex gap-2">
            <button onclick="toggleGrid()" class="bg-slate-900/80 hover:bg-slate-800 text-slate-300 border border-slate-700 px-3 py-1.5 rounded-lg text-xs font-medium backdrop-blur-md transition flex items-center gap-1.5">
                <i class="fa-solid fa-border-all"></i> 格子 격자 On/Off
            </button>
        </div>
    </main>

    <script>
        // --- 1. 분자 데이터 정의 (암모니아 좌표는 이미지의 값과 정확히 일치) ---
        const PRESETS = {
            NH3: {
                name: "암모니아 (NH₃)",
                formula: "NH₃",
                center: { name: "N₁", symbol: "N", x: 0.000, y: 0.000, z: 0.000, color: 0x3b82f6 },
                outer: [
                    { name: "H₂", symbol: "H", x: 0.928, y: 0.000, z: 0.372, color: 0xf8fafc },
                    { name: "H₃", symbol: "H", x: -0.464, y: 0.804, z: 0.372, color: 0xf8fafc },
                    { name: "H₄", symbol: "H", x: -0.464, y: -0.804, z: 0.372, color: 0xf8fafc }
                ]
            },
            CH4: {
                name: "메테인 (CH₄)",
                formula: "CH₄",
                center: { name: "C₁", symbol: "C", x: 0.000, y: 0.000, z: 0.000, color: 0x64748b },
                outer: [
                    { name: "H₂", symbol: "H", x: 0.000, y: 1.029, z: 0.000, color: 0xf8fafc },
                    { name: "H₃", symbol: "H", x: 0.970, y: -0.343, z: 0.000, color: 0xf8fafc },
                    { name: "H₄", symbol: "H", x: -0.485, y: -0.343, z: 0.840, color: 0xf8fafc },
                    { name: "H₅", symbol: "H", x: -0.485, y: -0.343, z: -0.840, color: 0xf8fafc }
                ]
            },
            H2O: {
                name: "물 (H₂O)",
                formula: "H₂O",
                center: { name: "O₁", symbol: "O", x: 0.000, y: 0.000, z: 0.000, color: 0xef4444 },
                outer: [
                    { name: "H₂", symbol: "H", x: 0.757, y: 0.586, z: 0.000, color: 0xf8fafc },
                    { name: "H₃", symbol: "H", x: -0.757, y: 0.586, z: 0.000, color: 0xf8fafc }
                ]
            },
            CO2: {
                name: "이산화탄소 (CO₂)",
                formula: "CO₂",
                center: { name: "C₁", symbol: "C", x: 0.000, y: 0.000, z: 0.000, color: 0x64748b },
                outer: [
                    { name: "O₂", symbol: "O", x: 1.160, y: 0.000, z: 0.000, color: 0xef4444 },
                    { name: "O₃", symbol: "O", x: -1.160, y: 0.000, z: 0.000, color: 0xef4444 }
                ]
            },
            BF3: {
                name: "삼불화붕소 (BF₃)",
                formula: "BF₃",
                center: { name: "B₁", symbol: "B", x: 0.000, y: 0.000, z: 0.000, color: 0xf59e0b },
                outer: [
                    { name: "F₂", symbol: "F", x: 1.300, y: 0.000, z: 0.000, color: 0x10b981 },
                    { name: "F₃", symbol: "F", x: -0.650, y: 1.126, z: 0.000, color: 0x10b981 },
                    { name: "F₄", symbol: "F", x: -0.650, y: -1.126, z: 0.000, color: 0x10b981 }
                ]
            }
        };

        let currentMolecule = JSON.parse(JSON.stringify(PRESETS.NH3));
        let bondScale = 1.0;

        // Three.js 전역 변수
        let scene, camera, renderer, controls;
        let moleculeGroup, gridHelper, axesHelper;

        function initThreeJS() {
            const container = document.getElementById('canvas-container');
            const width = container.clientWidth || window.innerWidth;
            const height = container.clientHeight || window.innerHeight;

            // 1. Scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x020617); // Slate 950

            // 2. Camera
            camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
            camera.position.set(3.5, 2.5, 4.5);

            // 3. Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(width, height);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            // 4. OrbitControls
            if (typeof THREE.OrbitControls !== 'undefined') {
                controls = new THREE.OrbitControls(camera, renderer.domElement);
            } else if (typeof OrbitControls !== 'undefined') {
                controls = new OrbitControls(camera, renderer.domElement);
            }
            if (controls) {
                controls.enableDamping = true;
                controls.dampingFactor = 0.05;
            }

            // 5. Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const dirLight1 = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight1.position.set(5, 10, 7);
            scene.add(dirLight1);

            const dirLight2 = new THREE.DirectionalLight(0x3b82f6, 0.3);
            dirLight2.position.set(-5, -5, -5);
            scene.add(dirLight2);

            // 6. Grid & Coordinate Axes
            gridHelper = new THREE.GridHelper(10, 20, 0x475569, 0x1e293b);
            gridHelper.position.y = -0.001; // Z/Y 평면 시각 보정
            scene.add(gridHelper);

            // 공간좌표 축 (X: 빨강, Y: 초록, Z: 파랑)
            axesHelper = new THREE.AxesHelper(3);
            // 축 두께 설정
            axesHelper.material.linewidth = 3;
            axesHelper.renderOrder = 1;
            scene.add(axesHelper);

            // 7. 분자 그룹 객체
            moleculeGroup = new THREE.Group();
            scene.add(moleculeGroup);

            // 최초 렌더링
            renderMolecule();

            // Resize 이벤트
            window.addEventListener('resize', onWindowResize);
            
            // Container ResizeObserver (프리뷰 창 크기 변경 대응)
            if (window.ResizeObserver) {
                new ResizeObserver(() => onWindowResize()).observe(container);
            }

            // 애니메이션 루프 시작
            animate();
        }

        function renderMolecule() {
            // 기존 분자 모형 제거
            while (moleculeGroup.children.length > 0) {
                const obj = moleculeGroup.children[0];
                moleculeGroup.remove(obj);
            }

            const center = currentMolecule.center;
            const outerAtoms = currentMolecule.outer;

            // 1. 중심원자 생성 (원점 0,0,0 배치)
            const centerGeo = new THREE.SphereGeometry(0.35, 32, 32);
            const centerMat = new THREE.MeshStandardMaterial({
                color: center.color,
                roughness: 0.2,
                metalness: 0.1
            });
            const centerMesh = new THREE.Mesh(centerGeo, centerMat);
            centerMesh.position.set(0, 0, 0);
            moleculeGroup.add(centerMesh);

            // 2. 주변 원자 및 결합(Cylinder) 생성
            outerAtoms.forEach((atom) => {
                const scaledX = atom.x * bondScale;
                const scaledY = atom.y * bondScale;
                const scaledZ = atom.z * bondScale;

                const pos = new THREE.Vector3(scaledX, scaledY, scaledZ);

                // 주변 원자 구형
                const atomGeo = new THREE.SphereGeometry(0.22, 32, 32);
                const atomMat = new THREE.MeshStandardMaterial({
                    color: atom.color,
                    roughness: 0.3,
                    metalness: 0.1
                });
                const atomMesh = new THREE.Mesh(atomGeo, atomMat);
                atomMesh.position.copy(pos);
                moleculeGroup.add(atomMesh);

                // 결합 봉 (Cylinder)
                const startPos = new THREE.Vector3(0, 0, 0);
                const endPos = pos.clone();
                const distance = startPos.distanceTo(endPos);

                if (distance > 0.001) {
                    const cylinderGeo = new THREE.CylinderGeometry(0.06, 0.06, distance, 16);
                    const cylinderMat = new THREE.MeshStandardMaterial({
                        color: 0x94a3b8,
                        roughness: 0.4
                    });
                    const cylinder = new THREE.Mesh(cylinderGeo, cylinderMat);

                    // 위치 및 회전 설정 (두 점 이어주기)
                    const midPos = startPos.clone().add(endPos).divideScalar(2);
                    cylinder.position.copy(midPos);

                    const direction = endPos.clone().sub(startPos).normalize();
                    const arrow = new THREE.Vector3(0, 1, 0);
                    cylinder.quaternion.setFromUnitVectors(arrow, direction);

                    moleculeGroup.add(cylinder);
                }
            });

            // 테이블 UI 업데이트
            updateAtomTable();
        }

        function updateAtomTable() {
            const tbody = document.getElementById('atomTableBody');
            tbody.innerHTML = '';

            const center = currentMolecule.center;
            // 중심원자 표 추가
            const centerRow = document.createElement('tr');
            centerRow.className = "bg-blue-500/10 font-semibold";
            centerRow.innerHTML = `
                <td class="py-2 px-3 flex items-center gap-1.5 text-blue-300">
                    <span class="w-2 h-2 rounded-full bg-blue-400"></span>
                    ${center.name}
                </td>
                <td class="py-2 px-2 text-center">0.000</td>
                <td class="py-2 px-2 text-center">0.000</td>
                <td class="py-2 px-2 text-center">0.000</td>
            `;
            tbody.appendChild(centerRow);

            // 주변 원자 표 추가
            currentMolecule.outer.forEach((atom) => {
                const sx = (atom.x * bondScale).toFixed(3);
                const sy = (atom.y * bondScale).toFixed(3);
                const sz = (atom.z * bondScale).toFixed(3);

                const row = document.createElement('tr');
                row.className = "hover:bg-slate-800/40 transition";
                row.innerHTML = `
                    <td class="py-2 px-3 flex items-center gap-1.5">
                        <span class="w-2 h-2 rounded-full bg-slate-400"></span>
                        ${atom.name}
                    </td>
                    <td class="py-2 px-2 text-center ${parseFloat(sx) < 0 ? 'text-red-300' : ''}">${sx}</td>
                    <td class="py-2 px-2 text-center ${parseFloat(sy) < 0 ? 'text-emerald-300' : ''}">${sy}</td>
                    <td class="py-2 px-2 text-center ${parseFloat(sz) < 0 ? 'text-blue-300' : ''}">${sz}</td>
                `;
                tbody.appendChild(row);
            });
        }

        function handlePresetChange() {
            const presetKey = document.getElementById('moleculePreset').value;
            const customContainer = document.getElementById('customFormulaContainer');
            const customControls = document.getElementById('customAtomControls');

            if (presetKey === 'CUSTOM') {
                customContainer.classList.remove('hidden');
                customControls.classList.remove('hidden');
                currentMolecule = {
                    name: "사용자 지정 분자",
                    formula: "AX3",
                    center: { name: "A₁", symbol: "A", x: 0.000, y: 0.000, z: 0.000, color: 0xa855f7 },
                    outer: [
                        { name: "X₂", symbol: "X", x: 1.000, y: 0.000, z: 0.000, color: 0xf8fafc }
                    ]
                };
            } else {
                customContainer.classList.add('hidden');
                customControls.classList.add('hidden');
                currentMolecule = JSON.parse(JSON.stringify(PRESETS[presetKey]));
            }

            document.getElementById('badgeMoleculeName').textContent = currentMolecule.name;
            renderMolecule();
        }

        function handleDistanceChange() {
            const val = parseFloat(document.getElementById('distanceSlider').value);
            bondScale = val;
            document.getElementById('distanceValue').textContent = val.toFixed(3);
            renderMolecule();
        }

        function updateCustomMoleculeName() {
            const name = document.getElementById('customFormulaInput').value || "사용자 지정";
            currentMolecule.name = name;
            document.getElementById('badgeMoleculeName').textContent = name;
        }

        function addCustomAtom() {
            const name = document.getElementById('newAtomName').value || "X";
            const x = parseFloat(document.getElementById('newAtomX').value) || 0;
            const y = parseFloat(document.getElementById('newAtomY').value) || 0;
            const z = parseFloat(document.getElementById('newAtomZ').value) || 0;

            const idx = currentMolecule.outer.length + 2;
            currentMolecule.outer.push({
                name: `${name}${idx}`,
                symbol: name,
                x: x,
                y: y,
                z: z,
                color: 0xf8fafc
            });

            renderMolecule();
        }

        function toggleGrid() {
            gridHelper.visible = !gridHelper.visible;
        }

        function resetCamera() {
            camera.position.set(3.5, 2.5, 4.5);
            if (controls) {
                controls.target.set(0, 0, 0);
                controls.update();
            }
        }

        function onWindowResize() {
            const container = document.getElementById('canvas-container');
            if (!container || !renderer || !camera) return;

            const width = container.clientWidth;
            const height = container.clientHeight;

            if (width === 0 || height === 0) return;

            camera.aspect = width / height;
            camera.updateProjectionMatrix();
            renderer.setSize(width, height);
        }

        function animate() {
            requestAnimationFrame(animate);
            if (controls) controls.update();
            if (renderer && scene && camera) {
                renderer.render(scene, camera);
            }
        }

        window.onload = function() {
            initThreeJS();
        };
    </script>
</body>
</html>
